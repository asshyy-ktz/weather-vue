<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather — Offline</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .cloud {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #94a3b8;
        max-width: 26rem;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 0.5rem;
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="cloud">☁️</div>
      <h1>You're offline</h1>
      <p>
        Weather can't reach the network right now. Your saved locations and their last-fetched
        forecasts are still available from the app once you reconnect or reopen it.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
